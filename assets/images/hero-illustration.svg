<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Circles -->
  <circle cx="300" cy="250" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="450" cy="140" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="360" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <!-- Background Cyber Grid Elements -->
  <g opacity="0.25" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5">
    <circle cx="300" cy="250" r="210"/>
    <circle cx="300" cy="250" r="160"/>
    <line x1="90" y1="250" x2="510" y2="250"/>
    <line x1="300" y1="40" x2="300" y2="460"/>
  </g>

  <!-- Central Shield Base -->
  <path d="M300 70 L430 130 V250 C430 350 300 420 300 420 C300 420 170 350 170 250 V130 Z" 
        fill="url(#shieldFill)" stroke="url(#primaryGrad)" stroke-width="5" filter="drop-shadow(0 15px 35px rgba(99, 102, 241, 0.35))"/>

  <!-- Inner Shield Pattern -->
  <path d="M300 100 L400 150 V245 C400 325 300 385 300 385 C300 385 200 325 200 245 V150 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Central Verified Checkmark -->
  <path d="M260 250 L290 280 L350 205" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 10px #38bdf8)"/>

  <!-- Floating Simulated Suspicious Phishing Bait Node (Blocked) -->
  <g transform="translate(100, 120)">
    <rect width="140" height="70" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="2" filter="drop-shadow(0 8px 20px rgba(244,63,94,0.3))"/>
    <circle cx="25" cy="25" r="12" fill="url(#dangerGrad)"/>
    <text x="25" y="29" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">!</text>
    <text x="45" y="24" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">FAKE DOMAIN</text>
    <text x="45" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9.5">paypa1-secure.com</text>
    <rect x="15" y="52" width="110" height="4" rx="2" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Floating Security Verification Lock Node -->
  <g transform="translate(370, 310)">
    <rect width="150" height="75" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 8px 20px rgba(16,185,129,0.25))"/>
    <circle cx="28" cy="28" r="13" fill="#10b981"/>
    <!-- Lock inside circle -->
    <path d="M25 24 V22 A3 3 0 0 1 31 22 V24 M23 24 H33 V31 H23 Z" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="50" y="26" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">MFA ACTIVE</text>
    <text x="50" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Identity Protected</text>
    <text x="50" y="56" fill="#06b6d4" font-family="sans-serif" font-size="8.5" font-weight="bold">100% VERIFIED</text>
  </g>

  <!-- Connective Digital Circuit Line -->
  <path d="M240 155 Q270 170 290 190" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="290" cy="190" r="4" fill="#f43f5e"/>

  <path d="M370 345 Q340 330 320 300" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="320" cy="300" r="4" fill="#10b981"/>
</svg>
